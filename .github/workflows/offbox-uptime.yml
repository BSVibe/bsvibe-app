# Off-box uptime watch — 게이트 3 (가용성).
#
# Every monitor that runs ON the Mac Mini (watchdog, uptime-probe, autodeploy)
# dies WITH the machine: a power cut, a kernel panic, or a lost network link goes
# unnoticed because the thing that would have noticed is also gone. This job runs
# on GitHub's runners, so it is genuinely off-box and survives the box.
#
# ⚠️ ``runs-on: ubuntu-latest`` is load-bearing. This repo also has a SELF-HOSTED
# runner on that same Mac Mini; scheduling this onto it would recreate the exact
# blind spot the job exists to close — the monitor would die with its subject.
#
# Alerting needs no setup: GitHub emails the repo owner when a scheduled workflow
# fails, and the run shows red in the Actions tab.
#
# What this canNOT do, and why the push-based heartbeat is still worth adding:
# this is POLL-IN monitoring. It sees "prod did not answer me", which cannot
# distinguish a dead box from a broken network path, and a cache or tunnel quirk
# could in principle answer on prod's behalf. ``_infra/scripts/heartbeat.sh`` is
# the complement — the box itself decides it is healthy and pushes, so silence is
# the signal. That one needs an off-box check URL in ~/.bsvibe/heartbeat.env.

name: Off-box uptime

on:
  schedule:
    # Every 15 minutes. GitHub's cron is best-effort and can run late under load,
    # which is fine for a liveness watch — but it is why the alert threshold below
    # is "two consecutive probes", not "one slow response".
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # A delayed run must never pile up behind the next scheduled one.
  group: offbox-uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe prod from off the box
        env:
          HEALTH_URL: https://api.bsvibe.dev/api/health
        run: |
          set -uo pipefail

          # ``/api/health`` is the app's OWN route and answers
          # {"status":"ok","version":…,"git_sha":…}. Requiring 200 from THIS path
          # is what makes the check able to fail: an earlier draft probed
          # ``/api/v1/health`` — a path that does not exist — and accepted "any
          # real HTTP response", so the 404 that Caddy or Cloudflare would return
          # with the app completely gone read as "prod is up". A check that
          # cannot go red measures nothing.
          #
          # NOTE: no ``|| echo 000`` here. curl -w already prints the code, so the
          # fallback would CONCATENATE and yield "000000" — a string that matches
          # no case below and silently passes. That bug has appeared twice in this
          # repo's probes; ``${code:-000}`` is the correct empty-guard.
          probe() {
            local code
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$HEALTH_URL" 2>/dev/null)"
            printf '%s' "${code:-000}"
          }

          first="$(probe)"
          echo "probe 1: HTTP $first"
          if [ "$first" = "200" ]; then
            echo "prod is up — $(curl -s --max-time 20 "$HEALTH_URL")"
            exit 0
          fi

          # One bad probe is not an outage: GitHub runners have their own network
          # blips, and a deploy restarts the backend for a few seconds. Confirm
          # before alerting so this stays a signal people still believe.
          echo "first probe failed — re-checking in 30s before alerting"
          sleep 30
          second="$(probe)"
          echo "probe 2: HTTP $second"
          if [ "$second" != "200" ]; then
            echo "::error::prod unhealthy from off-box: HTTP $first then $second ($HEALTH_URL)"
            exit 1
          fi
          echo "prod recovered on the second probe (HTTP $second) — not alerting"
